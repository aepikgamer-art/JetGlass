name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    # macOS 26 runner → Xcode 26 SDK → iOS 26 Liquid Glass APIs compile.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode (must be 26+ for Liquid Glass)
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          XCODE_MAJOR=$(xcodebuild -version | awk '{print $2; exit}' | cut -d. -f1)
          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "::error::Xcode 26+ is required for iOS 26 Liquid Glass (glassEffect). Found $(xcodebuild -version)."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project JetGlass.xcodeproj \
            -scheme JetGlass \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/JetGlass.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | xcpretty

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/JetGlass.xcarchive/Products/Applications/JetGlass.app" build/Payload/
          cd build
          zip -qry JetGlass.ipa Payload
          ls -lh JetGlass.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JetGlass-ipa
          path: build/JetGlass.ipa
          retention-days: 30

      - name: Create GitHub Release with the IPA
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/JetGlass.ipa \
            --title "JetGlass ${GITHUB_REF_NAME}" \
            --notes "Unsigned IPA built on macOS 26 with Xcode 26 (iOS 26 Liquid Glass).

          **Download:** \`JetGlass.ipa\` below, or the permanent link: https://github.com/aepikgamer-art/JetGlass/releases/latest/download/JetGlass.ipa

          **Add to AltStore / SideStore / StikStore via AltDirect:** https://altdirect.app/?url=https%3A%2F%2Fraw.githubusercontent.com%2Faepikgamer-art%2FJetGlass%2Fmain%2Faltstore-source.json

          **Source:** https://github.com/aepikgamer-art/JetGlass

          Sideload with AltStore (Classic), SideStore, or Sideloadly. Not App Store signed." \
            || gh release upload "${GITHUB_REF_NAME}" build/JetGlass.ipa --clobber

      - name: Upload xcarchive logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/**/*.xcactivitylog
          if-no-files-found: ignore
          retention-days: 7
